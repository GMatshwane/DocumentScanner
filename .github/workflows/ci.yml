name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc

      - name: Run unit tests
        run: npm test

      - name: Archive test results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-results
          path: |
            coverage
            test-results
          if-no-files-found: ignore

  # Optional Native builds (Android) - add a matrix if needed
  android-build:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Accept Android Licenses
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: npx ns build android --env.production --no-hmr

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # iOS builds require macOS runner
  ios-build:
    runs-on: macos-latest
    needs: build-test
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build iOS App (Simulator)
        run: npx ns build ios --env.production --no-hmr --for-device false

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: platforms/ios/build/**/*.app
          if-no-files-found: warn
